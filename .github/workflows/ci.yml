name: CI

on:
  push:
    branches: [main]  # feature branches are tested once, via their PR
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  test:
    name: GUT tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-editor-${{ env.GODOT_RELEASE }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Run tests
        run: ~/godot/godot --headless --path game -s addons/gut/gut_cmdln.gd -gexit

  export:
    name: Export Windows + Linux
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-full-${{ env.GODOT_RELEASE }}

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path game --export-release "Windows" ../build/windows/Twicefall.exe
          test -f build/windows/Twicefall.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          ~/godot/godot --headless --path game --export-release "Linux" ../build/linux/Twicefall.x86_64
          test -f build/linux/Twicefall.x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: twicefall-windows
          path: build/windows/

      - uses: actions/upload-artifact@v7
        with:
          name: twicefall-linux
          path: build/linux/
